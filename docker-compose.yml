services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: baksho_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baksho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baksho_secret}
      POSTGRES_DB: ${POSTGRES_DB:-baksho_ecommerce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baksho}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Next.js)
  backend:
    container_name: baksho_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-baksho}:${POSTGRES_PASSWORD:-baksho_secret}@db:5432/${POSTGRES_DB:-baksho_ecommerce}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-baksho}:${POSTGRES_PASSWORD:-baksho_secret}@db:5432/${POSTGRES_DB:-baksho_ecommerce}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js)
  frontend:
    container_name: baksho_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_FRONTEND_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
